spring.application.name=rest-api-demo

#Configurar las credenciales de conexion a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/comercio
spring.datasource.username=cursom
spring.datasource.password=Temp2026$$

# Para configurar el ORM Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# La siguiente clave (key) ofrece mas informacion por la consola respecto a las consultas
# o sentencias del SQL generadas por HIBERNATE
spring.jpa.properties.hibernate.format_sql=false

# Para que un tipo primitivo que no admita null le asigne el valor de cero
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Clave para firmar el token https://jwtsecrets.com/#generator
demo.app.jwtSecret=e30ef6c8d6c65198376480873d269aaba5ea161817a7ed40655d4fa15abab8d8
demo.app.jwtExpirationMs=86400000

# Nivel de error
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR