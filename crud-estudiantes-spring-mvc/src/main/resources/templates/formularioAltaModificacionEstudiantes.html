<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="" />
    <title>Formulario alta/modificación</title>
  </head>
  <body>
    <h1>Formulario alta/modificación</h1>
    <fieldset>
      <legend>Formulario de alta o modificación</legend>
      <form
        th:action="@{/estudiantes/persistir}"
        method="post"
        th:object="${estudiante}"
      >
        <input type="hidden" th:field="*{id}" />
        <div>
          <label for="nombre">Nombre:</label>
          <input
            th:field="*{nombre}"
            type="text"
            id="nombre"
            name="nombre"
            value=""
            placeholder="su nombre aquí, por favor"
            required
          />
        </div>
        <div>
          <label for="primerApellido">Primer apellido:</label>
          <input
            th:field="*{primerApellido}"
            type="text"
            id="primerApellido"
            name="primerApellido"
            value=""
            placeholder="su primer apellido aquí, por favor"
            required
          />
        </div>
        <div>
          <label for="segundoApellido">Segundo apellido:</label>
          <input
            th:field="*{segundoApellido}"
            type="text"
            id="segundoApellido"
            name="segundoApellido"
            value=""
            placeholder="su segundo apellido aquí, por favor"
          />
        </div>
        <div>
          <label for="fechaMatricula">Fecha de alta:</label>
          <input
            th:field="*{fechaMatricula}"
            type="date"
            id="fechaMatricula"
            name="fechaMatricula"
            value=""
            placeholder="su fecha de alta aquí, por favor"
            required
          />
        </div>
        <div>
          <fieldset>
            <legend>Género</legend>
            <label for="hombre">Hombre:</label>
            <input
              th:field="*{genero}"
              type="radio"
              name="genero"
              id="hombre"
              value="HOMBRE"
              required
            /><br />
            <label for="mujer">Mujer:</label>
            <input
              th:field="*{genero}"
              type="radio"
              name="genero"
              id="mujer"
              value="MUJER"
              required
            /><br />
            <label for="otro">Otro:</label>
            <input
              th:field="*{genero}"
              type="radio"
              name="genero"
              id="otro"
              value="OTRO"
              required
            /><br />
          </fieldset>
        </div>
        <div>
          <label for="facultad">Facultad:</label>
          <select id="facultad" th:field="*{facultad}" required>
            <option value=""></option>
            <option
              th:each="facultad:${facultades}"
              th:value="${facultad.id}"
              th:text="${facultad.nombre}"
            ></option>
          </select>
        </div>
        <div>
          <p>
            <label for="correosFormulario">Correos:</label><br />
            <textarea
              th:text="${correosSeparador}"
              rows="5"
              cols="40"
              id="correosFormulario"
              name="correosFormulario"
              placeholder="uno o varios separados por punto y coma, por favor"
            ></textarea>
          </p>
          <p>
            <label for="telefonosFormulario">Teléfonos:</label><br />
            <textarea
              th:text="${telefonosSeparador}"
              rows="5"
              cols="40"
              id="telefonosFormulario"
              name="telefonosFormulario"
              placeholder="uno o varios separados por punto y coma, por favor"
            ></textarea>
          </p>
        </div>
        <input type="submit" value="Enviar" />
      </form>
    </fieldset>
    <div>
      <p><a th:href="@{/estudiantes/listar}">Listado de estudiante</a></p>
    </div>
  </body>
</html>
