spring.application.name=rest-api-many-to-many

# Configurar servidor
server.port=8080

# Configurar las credenciales de conexion a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/many-to-many
spring.datasource.username=cursom
spring.datasource.password=Temp2026$$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para configurar el ORM Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.column_ordering_strategy=legacy

# Envío de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-part-count=30

# Debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.orm.jdbc.bind=trace
#logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.tool.hbm2ddl=trace
#logging.level.org.springframework.data.jpa=trace
#logging.level.org.springframework.jdbc=debug

# Para que un tipo primitivo que no admita null le asigne el valor de cero
spring.jackson.deserialization.fail-on-null-for-primitives=false
